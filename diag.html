<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV diagnostic</title>
<style>
  html { font-size: calc(100vw / 120); }
  body { margin:0; background:#0a0c10; color:#f4f5f7; font-family:"Segoe UI",system-ui,Arial,sans-serif; }
  main { padding:3vh 4vw; }
  h1 { font-size:1.9rem; margin:0 0 .6rem; font-weight:600; }
  .row { font-size:1.05rem; line-height:1.35; margin:.2rem 0; word-break:break-all; }
  .pass { color:#5be38c; } .fail { color:#ff7a7a; } .info { color:#a3abb8; }
  #keys { position:fixed; left:4vw; bottom:3vh; font-size:1.3rem; color:#ffb454; }
</style>
</head>
<body>
<main><h1>What can this page do on the TV? (v7)</h1><div id="out"></div></main>
<div id="keys">Press any remote button to test it.</div>
<script>
window.onerror = function (msg, src, line) {
  if (window.__quiet) return;
  document.body.insertAdjacentHTML('beforeend', '<pre style="color:#ff7a7a;font-size:22px;white-space:pre-wrap">Error: ' + msg + ' (line ' + line + ')</pre>');
};
</script>
<script>
const TV = '192.168.1.110';
const out = document.getElementById('out'), keysEl = document.getElementById('keys');
const log = (c, t) => { const d = document.createElement('div'); d.className = 'row ' + c; d.textContent = t; out.appendChild(d); };
let lastBack = 0, dialN = 0;
function formPost(app) {
  let fr = document.getElementById('hf');
  if (!fr) { fr = document.createElement('iframe'); fr.name = 'hf'; fr.id = 'hf'; fr.style.display = 'none'; document.body.appendChild(fr); }
  const f = document.createElement('form');
  f.method = 'POST'; f.action = 'http://' + TV + ':8008/apps/' + app; f.target = 'hf'; f.enctype = 'text/plain'; f.rel = 'noreferrer';
  document.body.appendChild(f); f.submit(); f.remove();
}
function dialTry() {
  const app = ['YouTube', 'Netflix'][dialN++ % 2];
  formPost(app);
  log('info', 'Sent launch for ' + app + ' (form post, no referrer). Did it open on the TV?');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') dialTry();
  keysEl.textContent = 'Last key: ' + e.key + '   code ' + e.keyCode;
  const back = ['Escape', 'Backspace', 'BrowserBack', 'XF86Back'].includes(e.key) || e.keyCode === 10009;
  if (back) { const n = Date.now(); if (n - lastBack < 1500) location.href = './'; lastBack = n; keysEl.textContent += '   (press again to exit)'; }
});
const timed = (url, o) => {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 6000);
  return fetch(url, Object.assign({ signal: c.signal }, o)).finally(() => clearTimeout(t));
};
const probeImg = url => new Promise(res => {
  const s = Date.now(), i = new Image();
  const done = r => res(r + ' after ' + (Date.now() - s) + ' ms');
  i.onload = () => done('loaded'); i.onerror = () => done('error');
  setTimeout(() => done('timeout'), 6000); i.src = url + '/?' + s;
});
const scriptProbe = url => new Promise(res => {
  const s = Date.now(), el = document.createElement('script');
  const done = r => { el.remove(); res(r + ' (' + (Date.now() - s) + ' ms)'); };
  el.onload = () => done('answered OK'); el.onerror = () => done('error, non-OK answer, or blocked');
  setTimeout(() => done('timeout'), 6000); el.src = url; document.head.appendChild(el);
});

(async () => {
  log('info', 'Page: ' + location.href);
  log('info', 'Browser: ' + navigator.userAgent);
  log('info', 'Screen ' + screen.width + 'x' + screen.height + ', pixel ratio ' + devicePixelRatio + ', secure context: ' + isSecureContext);
  const f = document.createElement('iframe'); f.style.display = 'none'; document.body.appendChild(f);
  const std = new Set(Object.getOwnPropertyNames(f.contentWindow));
  const extra = Object.getOwnPropertyNames(window).filter(k => !std.has(k));
  log('info', 'Extra globals: ' + (extra.length ? extra.join(', ') : 'none'));
  log('info', 'chrome: ' + typeof window.chrome + ', cast: ' + typeof window.cast + ', serviceWorker: ' + ('serviceWorker' in navigator));
  try { const n = (+localStorage.getItem('visits') || 0) + 1; localStorage.setItem('visits', n); log('pass', 'Storage works, visit number ' + n); }
  catch (e) { log('fail', 'Storage unavailable (' + e.name + ')'); }
  try { const s = Date.now(); const r = await timed('https://api.github.com/zen'); log('pass', 'Internet fetch works (HTTP ' + r.status + ', ' + (Date.now() - s) + ' ms)'); }
  catch (e) { log('fail', 'Internet fetch failed: ' + e.name + ' ' + e.message); }
  const bases = ['https://127.0.0.1:7345', 'https://' + TV + ':7345', 'https://' + TV + ':9000', 'http://' + TV + ':9000'];
  for (const b of bases) {
    const s = Date.now();
    try {
      await timed(b + '/', { mode: 'no-cors' }); log('pass', 'Reachable: ' + b);
      try {
        const r = await timed(b + '/pairing/start', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ DEVICE_NAME: 'Diag', DEVICE_ID: 'diag' }) });
        log('pass', 'API works at ' + b + ' (HTTP ' + r.status + ')');
      } catch (e) { log('fail', 'API blocked at ' + b + ' (' + e.name + ')'); }
    } catch (e) { log('fail', 'Blocked: ' + b + ' (' + e.name + ', ' + (Date.now() - s) + ' ms)'); }
    log('info', '   image probe: ' + await probeImg(b));
  }
  const D = 'http://' + TV + ':8008', s8 = Date.now();
  try { await timed(D + '/ssdp/device-desc.xml', { mode: 'no-cors' }); log('pass', 'Cast port reachable: ' + D); }
  catch (e) { log('fail', 'Cast port blocked: ' + D + ' (' + e.name + ', ' + (Date.now() - s8) + ' ms)'); }
  try { const r = await timed(D + '/setup/eureka_info?params=name'); log('pass', 'Cast info readable: ' + (await r.text()).slice(0, 80)); }
  catch (e) { log('fail', 'Cast info not readable (' + e.name + ')'); }
  try { const r = await timed(D + '/ssdp/device-desc.xml'); log('pass', 'Device description: ' + (await r.text()).replace(/\s+/g, ' ').slice(0, 160)); }
  catch (e) { log('fail', 'Device description not readable (' + e.name + ')'); }
  window.__quiet = true;
  for (const a of ['YouTube', 'Netflix', 'Amazon', 'Hulu', 'Disney']) log('info', 'DIAL ' + a + ': ' + await scriptProbe(D + '/apps/' + a));
  window.__quiet = false;
  const ports = [80, 3000, 7000, 8008, 8060, 8080, 8443, 56789], hits = [];
  await Promise.all(ports.map(async p => {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 2500);
    try { await fetch('http://' + TV + ':' + p + '/', { mode: 'no-cors', signal: c.signal }); hits.push(p); } catch (e) {}
    clearTimeout(t);
  }));
  log(hits.length ? 'pass' : 'fail', 'Plain-HTTP ports that answered: ' + (hits.length ? hits.sort((a, b) => a - b).join(', ') : 'none'));
  log('info', 'Press OK to try opening YouTube on the TV through the Cast port. Press OK again for Netflix.');
  log('info', 'Done. Press remote buttons to see their codes. Press Back twice to exit.');
})();
</script>
</body>
</html>
